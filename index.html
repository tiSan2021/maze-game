<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- E3 应用壳：仅桌面浏览器，纯键盘。Canvas 960×640 + 顶部 32px DOM HUD。 -->
    <title>迷宫闯关</title>
    <style>
      /* U5 字号三档：全局乘数，由 src/main.ts 写入；默认 1（标准） */
      :root {
        --ui-scale: 1;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #f4f1ea;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        touch-action: none;
      }
      #app {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 960px;
        transform: translate(-50%, -50%);
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      /* HUD 容器：高度由 hud.ts 内联写入 HUD_H=32px（不占迷宫区高度） */
      #hud {
        box-sizing: border-box;
      }
      /* 迷宫画布：逻辑 960×640，主循环按 dpr 放大设备像素 */
      #game {
        display: block;
        background: #f4f1ea;
        touch-action: none;
      }
      /* 顶层状态覆盖层（MENU / LEVEL_SELECT / PAUSED / SETTLEMENT） */
      #overlay {
        position: absolute;
        left: 0;
        top: 32px;
        width: 960px;
        height: 640px;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: rgba(244, 241, 234, 0.94);
        color: #2a2419;
        text-align: center;
        font-size: calc(18px * var(--ui-scale));
        line-height: 1.6;
      }
      #overlay h1 {
        font-size: calc(30px * var(--ui-scale));
        margin: 0 0 8px;
      }
      #overlay .hint {
        font-size: 14px;
        color: #6b6152;
        font-size: calc(14px * var(--ui-scale));
      }
      #overlay kbd {
        background: #efe9dc;
        border: 1px solid #c9bfa9;
        border-radius: 4px;
        padding: 1px 6px;
        font-size: calc(13px * var(--ui-scale));
      }
      /* 移动端虚拟方向键（阶段 A+B 之 B；仅触屏设备挂载） */
      .dpad {
        position: absolute;
        right: 16px;
        bottom: 16px;
        width: 150px;
        height: 150px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: 6px;
        z-index: 10;
        touch-action: none;
      }
      .dpad-btn {
        border: 1px solid #c9bfa9;
        background: rgba(239, 233, 220, 0.9);
        border-radius: 10px;
        font-size: 22px;
        color: #2a2419;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
      .dpad-btn:active {
        background: #d8cfb8;
      }
      .dpad .up {
        grid-area: 1 / 2 / 2 / 3;
      }
      .dpad .left {
        grid-area: 2 / 1 / 3 / 2;
      }
      .dpad .down {
        grid-area: 3 / 2 / 4 / 3;
      }
      .dpad .right {
        grid-area: 2 / 3 / 3 / 4;
      }
      /* 阶段 C：覆盖层可点按钮（触屏 / 鼠标通用） */
      #overlay .ov-btn {
        display: inline-block;
        margin: 5px 6px;
        padding: 10px 22px;
        border: 1px solid #8a7a55;
        background: #8a7a55;
        color: #fff8ee;
        border-radius: 10px;
        font-size: calc(16px * var(--ui-scale));
        font-family: inherit;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      #overlay .ov-btn.alt {
        background: #efe9dc;
        color: #2a2419;
        border-color: #c9bfa9;
      }
      #overlay .ov-btn:active {
        background: #6f6243;
      }
      #overlay .ov-btn.alt:active {
        background: #ded4bd;
      }
      #overlay .lvl-chip {
        cursor: pointer;
        font-family: inherit;
        font-size: calc(13px * var(--ui-scale));
        background: #f4f1ea;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      #overlay .lvl-chip:active {
        background: #e6ddc8;
      }
      /* 暂停按钮：仅游玩态显示（由 touch.ts 控制显隐），位于画布右上角 */
      .pause-btn {
        position: absolute;
        top: 38px;
        right: 12px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid #c9bfa9;
        background: rgba(239, 233, 220, 0.92);
        color: #2a2419;
        font-size: 18px;
        line-height: 1;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 11;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      .pause-btn:active {
        background: #d8cfb8;
      }

    </style>
  </head>
  <body>
    <div id="app">
      <div id="hud"></div>
      <canvas id="game" width="960" height="640"></canvas>
      <div id="overlay"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
